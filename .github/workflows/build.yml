name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/PinOverlay.Core.Tests

      - name: Publish
        run: dotnet publish src/PinOverlay -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: pin-overlay
          path: publish/pin-overlay.exe
